services:
  config-check:
    build: .
    restart: "no"
    env_file: .env
    environment:
      CHECK_DB_NAME: ${DB_NAME:?Set DB_NAME in root .env}
      CHECK_DB_USER: ${DB_USER:?Set DB_USER in root .env}
      CHECK_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      CHECK_APP_PORT: ${APP_PORT:-3000}
    volumes:
      - ./.env:/app/.env:ro
    command: ["node", "dist/server/validate-config.js"]
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in root .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
    volumes:
      - hospitality-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      config-check:
        condition: service_completed_successfully
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      config-check:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.APP_PORT||3000)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  hospitality-db:
